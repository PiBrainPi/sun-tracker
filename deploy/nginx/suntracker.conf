# nginx-Server-Block für Sun Tracker (statisches Hosting)
# Beispiel: deine-domain.de ersetzen. Für Let's Encrypt: nach dem Hochladen
#   certbot --nginx -d deine-domain.de

server {
    listen 80;
    listen [::]:80;
    server_name deine-domain.de www.deine-domain.de;

    # Wurzelverzeichnis: hier liegt index.html (die Single-File-App)
    root /var/www/suntracker;
    index index.html;

    # Einzige Route: die App. Alles andere → 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache-Strategie: kurzes max-age, da die App weiterentwickelt wird.
    # Nach einem Update erzwingt der Browser einen frischen Abruf.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Gzip für schnelleres Laden der HTML/JS-App
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;
}

# SSL-Server-Block (nach certbot automatisch ergänzt) — siehe deploy/README.md